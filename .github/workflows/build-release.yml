name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            suffix: linux-x64
            needs_zip: true
          - os: windows-latest
            platform: win-x64
            suffix: win-x64
            needs_zip: true
          - os: macos-latest
            platform: osx-x64
            suffix: osx-x64
            needs_zip: true
          - os: macos-latest
            platform: osx-arm64
            suffix: osx-arm64
            needs_zip: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.platform }} --self-contained true -p:EnableCompressionInSingleFile=true -o ./publish/${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleApp-${{ matrix.suffix }}
          path: ./publish/${{ matrix.suffix }}/**
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare for upload
        run: |
          cd artifacts
          ls -la
          for dir in */; do
            name=$(basename "$dir")
            if [ -d "$dir" ]; then
              echo "Creating zip for $name"
              zip -r "${name}.zip" "$name"
            fi
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
