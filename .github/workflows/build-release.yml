name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            suffix: linux-x64
          - os: windows-latest
            platform: win-x64
            suffix: win-x64
          - os: macos-latest
            platform: osx-x64
            suffix: osx-x64
          - os: macos-latest
            platform: osx-arm64
            suffix: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.platform }} --self-contained true -p:PublishSingleFile=false -p:EnableCompressionInSingleFile=true -o ./publish/${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleApp-${{ matrix.suffix }}
          path: ./publish/${{ matrix.suffix }}/**
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create zip for Linux
        run: |
          cd artifacts
          zip -r SimpleApp-linux-x64.zip SimpleApp-linux-x64

      - name: Create zip for Windows
        run: |
          cd artifacts
          powershell -Command "Compress-Archive -Path 'SimpleApp-win-x64\*' -DestinationPath 'SimpleApp-win-x64.zip' -Force"

      - name: Create zip for macOS x64
        run: |
          cd artifacts
          zip -r SimpleApp-osx-x64.zip SimpleApp-osx-x64

      - name: Create zip for macOS ARM64
        run: |
          cd artifacts
          zip -r SimpleApp-osx-arm64.zip SimpleApp-osx-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/SimpleApp-linux-x64.zip
            artifacts/SimpleApp-win-x64.zip
            artifacts/SimpleApp-osx-x64.zip
            artifacts/SimpleApp-osx-arm64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
