name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            suffix: linux-x64
          - os: windows-latest
            platform: win-x64
            suffix: win-x64
          - os: macos-latest
            platform: osx-x64
            suffix: osx-x64
          - os: macos-latest
            platform: osx-arm64
            suffix: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: |
          if [[ "${{ matrix.platform }}" == osx* ]]; then
            dotnet publish -c Release -r ${{ matrix.platform }} --self-contained true -o ./publish/${{ matrix.suffix }}
            osx_app_dir="./publish/${{ matrix.suffix }}/SimpleApp.app"
            mkdir -p "$osx_app_dir/Contents/MacOS"
            mkdir -p "$osx_app_dir/Contents/Resources"
            cp "./publish/${{ matrix.suffix }}/SimpleApp" "$osx_app_dir/Contents/MacOS/"
            cp -r "./publish/${{ matrix.suffix }}/"*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"*.pdb "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"*.json "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"*.plist "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"*.runtimeconfig.json "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"lib* "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"Avalonia*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"Skia*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"HarfBuzz*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"mscorlib.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"netstandard.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"System*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"Microsoft*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"Mono*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"Newtonsoft*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cp -r "./publish/${{ matrix.suffix }}/"Tmds*.dll "$osx_app_dir/Contents/Resources/" 2>/dev/null || true
            cat > "$osx_app_dir/Contents/Info.plist" << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>SimpleApp</string>
    <key>CFBundleIdentifier</key>
    <string>com.simpleapp.iaStudio</string>
    <key>CFBundleName</key>
    <string>SimpleApp</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>CFBundleVersion</key>
    <string>1.0.0</string>
</dict>
</plist>
PLIST
            chmod +x "$osx_app_dir/Contents/MacOS/SimpleApp"
          else
            dotnet publish -c Release -r ${{ matrix.platform }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish/${{ matrix.suffix }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleApp-${{ matrix.suffix }}
          path: ./publish/${{ matrix.suffix }}/**
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare for upload
        run: |
          cd artifacts
          for dir in */; do
            name=$(basename "$dir")
            if [ -d "$dir" ]; then
              zip -r "${name}.zip" "$dir"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
